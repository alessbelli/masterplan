# CI for masterplan. Ordered cheap -> expensive so failures surface fast.
# See product-builder/guidance/08-ci-and-cost.md. Run these locally before pushing.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager"; don't also pass
      # `version` here — pnpm/action-setup@v4 errors if both are set.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
      - name: Unit + handler tests (Vitest + local D1)
        run: pnpm test

      # Standard GitHub runners don't ship Chromium; install the matching build.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (Playwright, web)
        run: pnpm test:e2e

      # Reviewers can open the trace/report from the PR without running a server.
      # (Artifact = secure; download + drag onto trace.playwright.dev. guidance/04.)
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            e2e/traces/**/trace.zip
            e2e/playwright-report/**
          if-no-files-found: ignore

# Deploys are intentionally MANUAL (run `pnpm deploy` locally). No auto-deploy on
# merge — CI only verifies. See docs/planning/status.md for the deploy commands.
