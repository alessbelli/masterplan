# CI for masterplan. Ordered cheap -> expensive so failures surface fast.
# See product-builder/guidance/08-ci-and-cost.md. Run these locally before pushing.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager"; don't also pass
      # `version` here — pnpm/action-setup@v4 errors if both are set.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
      - name: Unit + handler tests (Vitest + local D1)
        run: pnpm test

      # Standard GitHub runners don't ship Chromium; install the matching build.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (Playwright, web)
        run: pnpm test:e2e

      # Reviewers can open the trace/report from the PR without running a server.
      # (Artifact = secure; download + drag onto trace.playwright.dev. guidance/04.)
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            e2e/traces/**/trace.zip
            e2e/playwright-report/**
          if-no-files-found: ignore

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy (Cloudflare Workers + D1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set — skipping deploy."
            exit 0
          fi
          # The D1 database must be provisioned first (see docs/planning/status.md).
          # Until a real database_id is in wrangler.jsonc, skip rather than fail main.
          if grep -q "00000000-0000-0000-0000-000000000000" wrangler.jsonc; then
            echo "D1 database_id is still the placeholder — skipping deploy."
            echo "Run 'wrangler d1 create masterplan' and paste the id into wrangler.jsonc."
            exit 0
          fi
          pnpm db:migrate:remote
          pnpm deploy
