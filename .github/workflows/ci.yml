# CI for masterplan. Ordered cheap -> expensive so failures surface fast.
# See product-builder/guidance/08-ci-and-cost.md. Run these locally before pushing.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager"; don't also pass
      # `version` here — pnpm/action-setup@v4 errors if both are set.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
      - name: Unit + handler tests (Vitest + local D1)
        run: pnpm test

      # Standard GitHub runners don't ship Chromium; install the matching build.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (Playwright, web)
        run: pnpm test:e2e

      # Reviewers can open the trace/report from the PR without running a server.
      # (Artifact = secure; download + drag onto trace.playwright.dev. guidance/04.)
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            e2e/traces/**/trace.zip
            e2e/playwright-report/**
          if-no-files-found: ignore

# Deployment is NOT done here.
#
# masterplan is deployed by **Workers Builds** — the Cloudflare GitHub app —
# which builds and deploys straight from the repo, reading wrangler.jsonc:
#   * push to `main`     -> production deploy (`wrangler deploy`)
#   * push to any branch -> preview version   (`wrangler versions upload`)
#
# The build command must include `pnpm build:client` (esbuild bundles the client
# into public/) before wrangler deploy. That keeps CLOUDFLARE_API_TOKEN out of
# GitHub Actions entirely.
#
# What protects production is BRANCH PROTECTION on `main` (require `verify` + a
# review) — Workers Builds does not wait for this run.
# Settings + rationale: docs/deployment.md. See product-builder/guidance/12.
